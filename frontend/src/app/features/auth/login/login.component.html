<div class="auth-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="credentials.email" name="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="credentials.password" name="password" required>
        </mat-form-field>

        <p *ngIf="error" class="error-msg">{{ error }}</p>

        <button mat-flat-button color="primary" type="submit" [disabled]="!loginForm.valid" class="full-width">
          Log In
        </button>

      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button routerLink="/register">Don't have an account?</button>
    </mat-card-actions>
  </mat-card>
</div>

<style>
.auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f5f5f5;
}
mat-card {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}
.full-width {
  width: 100%;
  margin-bottom: 15px;
}
.error-msg {
  color: red;
  font-size: 14px;
}
</style>
