<mat-toolbar color="primary">
  <span>ExpenseTracker</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="dashboard-container">
  <div class="header-actions">
    <h2>My Expenses</h2>
    <button mat-raised-button color="accent" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add Expense
    </button>
  </div>

  <table mat-table [dataSource]="expenses" class="mat-elevation-z8 expense-table">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef> Amount </th>
      <td mat-cell *matCellDef="let element"> {{element.amount | currency}} </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let element"> {{element.date | date}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="openEditDialog(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteExpense(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  
  <p *ngIf="expenses.length === 0" class="no-data">No expenses found. Click 'Add Expense' to get started!</p>
</div>

<style>
.spacer {
  flex: 1 1 auto;
}
.dashboard-container {
  padding: 20px;
  max-width: 1000px;
  margin: 0 auto;
}
.header-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.expense-table {
  width: 100%;
}
.no-data {
  text-align: center;
  margin-top: 30px;
  color: #666;
  font-style: italic;
}
</style>
